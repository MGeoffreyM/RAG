[project]
name = "rag"
version = "0.1.0"
description = "Project RAG cursus 42"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "bm25s>=0.3.9",
    "esprima>=4.0.1",
    "fire>=0.7.1",
    "flake8>=7.3.0",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.2.4",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.2.2",
    "mypy>=2.1.0",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "python-magic>=0.4.27",
    "tqdm>=4.68.1",
    "tree-sitter<0.22.0",
    "tree-sitter-languages>=1.10.2",
    "types-tqdm>=4.68.0.20260608",
]

[tool.mypy]
exclude = [
    "^data/"
]

[[tool.mypy.overrides]]
module = ["bm25s.*", "fire.*"]
ignore_missing_imports = true
