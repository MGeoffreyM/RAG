[project]
name = "rag"
version = "0.1.0"
description = "Project RAG cursus 42"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.14.0",
    "bm25s>=0.3.9",
    "chromadb>=1.5.9",
    "einops>=0.8.2",
    "esprima>=4.0.1",
    "fastapi>=0.140.0",
    "fire>=0.7.1",
    "flake8>=7.3.0",
    "gguf>=0.19.0",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langchain-core>=0.1.52",
    "langchain-text-splitters>=0.0.1",
    "mypy>=2.1.0",
    "nvidia-cuda-nvcc-cu12>=12.9.86",
    "pillow>=12.2.0",
    "pydantic>=2.13.4",
    "pystemmer>=3.1.0",
    "python-dotenv>=1.2.2",
    "python-magic>=0.4.27",
    "sentence-transformers>=5.6.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
    "tqdm>=4.68.1",
    "tree-sitter<0.22.0",
    "tree-sitter-languages>=1.10.2",
    "types-tqdm>=4.68.0.20260608",
    "uvicorn>=0.51.0",
]

[tool.mypy]
exclude = [
    "^data/"
]

[[tool.mypy.overrides]]
module = ["bm25s.*", "fire.*", "Stemmer", "transformers.*"]
ignore_missing_imports = true

